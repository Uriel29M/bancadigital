  <!-- PDF.js -->
  <script>
    window.pdfjsReady = new Promise((resolve, reject) => {
      window.resolvePdfjs = resolve;
      window.rejectPdfjs = reject;
    });
  </script>
  <script type="module">
    // Carrega PDF.js localmente e configura o worker.
    // Certifique-se de que os arquivos pdf.min.mjs e pdf.worker.min.mjs
    // estão na pasta /js/pdfjs/ do seu projeto.
    import("./js/pdfjs/pdf.min.mjs").then(pdfjsLib => {
      const library = pdfjsLib;
      window.pdfjsLib = library;
      library.GlobalWorkerOptions.workerSrc = "./js/pdfjs/pdf.worker.min.mjs";
      window.resolvePdfjs(library);
      return library;
    }).catch(error => {
      console.error("Não foi possível carregar o PDF.js.", error);
      window.rejectPdfjs(error);
      throw error;
    });
  </script>
  <!-- JSZip para CBZ: tenta CDNs alternativos sem bloquear o restante da página. -->
  <script>
    window.jszipReady = navigator.onLine === false ? Promise.resolve(null) : new Promise(resolve => {
      const sources = [
        "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
        "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
      ];
      const load = index => {
        if (window.JSZip) return resolve(window.JSZip);
        if (index >= sources.length) return resolve(null);
        const script = document.createElement("script");
        script.src = sources[index];
        script.async = true;
        let settled = false;
        const next = () => {
          if (settled) return;
          settled = true;
          load(index + 1);
        };
        script.onload = () => window.JSZip ? (settled = true, resolve(window.JSZip)) : next();
        script.onerror = next;
        window.setTimeout(next, 8000);
        document.head.appendChild(script);
      };
      load(0);
    });
  </script>
  <script>
    // Leitor ZIP com HTTP Range: permite abrir a primeira página sem baixar o CBZ inteiro.
    window.zipJsReady = navigator.onLine === false
      ? Promise.resolve(null)
      : import("https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.57/+esm")
        .catch(error => { console.warn("zip.js progressivo indisponível:", error); return null; });
  </script>
