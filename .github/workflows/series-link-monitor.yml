name: Descobrir novas edições nas fontes

on:
  workflow_dispatch:

jobs:
  scan-series-sources:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Executar series-link-monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERIES_MONITOR_SECRET: ${{ secrets.SERIES_MONITOR_SECRET }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 -X POST "$SUPABASE_URL/functions/v1/series-link-monitor" \
            -H "x-series-monitor-secret: $SERIES_MONITOR_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
