name: Telegram message verification
on:
  push:
    branches: [fix/catalog-sync-20260907]
    paths: [.github/workflows/catalog-sync-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve the existing channel message
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = 'https://vqfmbpqurapcsuixgvql.supabase.co/functions/v1/telegram-file-diagnostic?check=bancahq-2'
          with urllib.request.urlopen(url, timeout=45) as response:
              result = json.load(response)
          assert result.get('ok') and result.get('file_name') == 'Casulo Metamorfose.pdf'
          assert result.get('file_size') == 19983904
          assert result.get('file_id')
          print('Verified file:', result['file_name'])
          print('File size:', result['file_size'])
          # file_id is an opaque identifier, not a bot token or download credential.
          print('Telegram file_id:', result['file_id'])
          PY
