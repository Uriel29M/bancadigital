name: Catalog sync audit
on:
  push:
    branches: [fix/catalog-sync-20260907]
    paths: [.github/workflows/catalog-sync-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            js/app.js
            js/data/dc-comics/recentes.js
            scripts/test-catalog-sync.mjs
          sparse-checkout-cone-mode: false
      - name: Extract exact source functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          src = Path('js/app.js').read_text(encoding='utf-8')
          out = Path('catalog-sync-audit')
          out.mkdir(exist_ok=True)
          names = ['publishCatalog','saveCatalog','openEditForm','save','render','loadAccount','loadCatalogVisibility','loadCoverChoices','loadSeriesCoverChoices','coverFor','seriesCoverFor','renderCatalog','renderCatalogLegacyBase']
          for name in names:
              matches = list(re.finditer(r'^  (?:async )?function '+name+r'\(', src, re.M))
              for n,match in enumerate(matches):
                  end = src.find('\n  }',match.start())
                  if end < 0: raise RuntimeError('Function boundary missing: '+name)
                  code = src[match.start():end+5]
                  (out/f'{name}-{n}.js').write_text(code+'\n',encoding='utf-8')
          lines=src.splitlines()
          (out/'store-core.js').write_text('\n'.join(lines[225:370])+'\n',encoding='utf-8')
          (out/'initialization.js').write_text('\n'.join(lines[-240:])+'\n',encoding='utf-8')
          (out/'metadata.txt').write_text('app_sha='+subprocess.check_output(['git','hash-object','js/app.js'],text=True).strip()+'\nlines='+str(len(lines))+'\n',encoding='utf-8')
          PY
      - name: Save audit on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse catalog-sync-audit/
          git commit -m "chore: collect exact catalog sync functions"
          git push origin HEAD:fix/catalog-sync-20260907
