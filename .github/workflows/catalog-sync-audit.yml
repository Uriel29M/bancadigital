name: Telegram integration inspection
on:
  push:
    branches: [fix/catalog-sync-20260907]
    paths: [.github/workflows/catalog-sync-audit.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Extract exact current functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('js/app.js').read_text()
          out=Path('catalog-sync-audit/telegram'); out.mkdir(parents=True,exist_ok=True)
          names=['openEditForm','saveCatalog','downloadSource','telegramProxyUrl','openReader','renderPDFReader','renderPdfReader','renderCBRReader','renderCBZReader','detectFormat','proxiedFileUrl','fetchReaderSource','refreshSharedCatalog']
          for name in names:
              matches=list(re.finditer(r'(?:async\s+)?function\s+'+name+r'\s*\(',app))
              for n,m in enumerate(matches):
                  brace=app.index('{',m.end()); depth=0; quote=None; esc=False; comment=None
                  # Extract JS function with braces, strings, comments and template interpolations handled by a lexical stack.
                  stack=[]; i=brace
                  while i<len(app):
                      c=app[i]; nxt=app[i+1:i+2]
                      if comment=='line':
                          if c=='\n': comment=None
                      elif comment=='block':
                          if c=='*' and nxt=='/': comment=None; i+=1
                      elif quote:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c==quote: quote=None
                      elif c=='/' and nxt=='/': comment='line'; i+=1
                      elif c=='/' and nxt=='*': comment='block'; i+=1
                      elif c in ('"',"'",'`'): quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: break
                      i+=1
                  # Template literals contain braces; use the next top-level function boundary if needed.
                  start=m.start(); end=i+1
                  nextfn=re.search(r'\n  (?:async\s+)?function\s+\w+\s*\(',app[start+1:])
                  if nextfn:
                      boundary=start+1+nextfn.start()
                      if end>boundary: end=boundary
                  (out/f'{name}-{n}.js').write_text(app[start:end])
                  print(name,n,app.count('\n',0,start)+1,end-start)
          for term in ['telegramFileId','renderPDF','pdfjsReady','downloadSource(item)','downloadSource(current','saveCatalog("Edição salva.','catalogEditedAt']:
              print('\nMATCHES',term)
              for m in list(re.finditer(re.escape(term),app))[:15]:
                  print(app.count('\n',0,m.start())+1,app[max(0,m.start()-160):m.start()+240].replace('\n',' '))
          PY
      - name: Store inspection on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/catalog-sync-20260907
          git checkout fix/catalog-sync-20260907
          git add catalog-sync-audit/telegram
          git commit -m "chore: capture Telegram integration source" || true
          git push origin HEAD:fix/catalog-sync-20260907
