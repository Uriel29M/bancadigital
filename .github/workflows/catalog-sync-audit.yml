name: Catalog sync verification
on:
  push:
    branches: [fix/catalog-sync-20260907]
    paths: [.github/workflows/catalog-sync-audit.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Finalize shared catalog recovery
        run: python3 scripts/finalize-catalog-sync.py
      - name: Verify application and regression tests
        run: |
          node --check js/app.js
          node --check js/catalog-sync.js
          node --test scripts/test-catalog-sync.mjs scripts/test-shared-catalog.mjs
      - name: Save verified source to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js scripts/test-shared-catalog.mjs
          git commit -m "fix: retry shared catalog loading and verify publisher protection"
          git push origin HEAD:fix/catalog-sync-20260907
