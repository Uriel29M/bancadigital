name: Telegram integration verification
on:
  push:
    branches: [fix/catalog-sync-20260907]
    paths: [.github/workflows/catalog-sync-audit.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply isolated integration to latest main
        run: |
          git fetch origin fix/catalog-sync-20260907
          git show origin/fix/catalog-sync-20260907:scripts/telegram-auto-repair.py > scripts/telegram-auto-repair.py
          git show origin/fix/catalog-sync-20260907:scripts/test-telegram-auto.mjs > scripts/test-telegram-auto.mjs
          python3 scripts/telegram-auto-repair.py
      - name: Validate JavaScript and regressions
        run: |
          node --check js/app.js
          node --check js/catalog-sync.js
          node --check js/telegram-auto.js
          node --check sw.js
          node --test scripts/test-catalog-sync.mjs scripts/test-shared-catalog.mjs scripts/test-telegram-auto.mjs
      - name: Verify real canonical PDF response
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base = 'https://vqfmbpqurapcsuixgvql.supabase.co/functions/v1/telegram-proxy?item_id=series-all-star-western-2011-novos-52-005'
          with urllib.request.urlopen(urllib.request.Request(base, headers={'Range':'bytes=0-1023'}), timeout=60) as response:
              data=response.read()
              assert response.status==206 and data.startswith(b'%PDF-')
              assert response.headers.get('Content-Range')=='bytes 0-1023/19983904'
              assert response.headers.get('Access-Control-Allow-Origin')=='*'
              print('Canonical PDF range verified:', response.status, len(data), response.headers.get('Content-Range'))
          PY
      - name: Save verified changes on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/catalog-sync.js js/telegram-auto.js index.html sw.js scripts/telegram-auto-repair.py scripts/test-telegram-auto.mjs
          git commit -m "fix: automatically resolve Telegram editions and read canonical source"
          git push origin HEAD:refs/heads/fix/telegram-auto-verified
