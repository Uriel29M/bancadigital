name: Telegram transport verification
on:
  push:
    branches: [fix/catalog-sync-20260907]
    paths: [.github/workflows/catalog-sync-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect current source and test actual PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, urllib.error, json
          a=Path('js/app.js').read_text().splitlines()
          for start,end in [(6480,6545),(6970,7135),(7150,7225),(8925,8990)]:
              print('\nSOURCE LINES',start,end)
              for n in range(start,end+1): print(f'{n}: {a[n-1]}')
          fid='BQACAgEAAyEFAAMBB73CigADAmqfMmcBSaket8QEOHTNeXjRui-BAALoCgACuBIhRBwRKTsYIBKZPQQ'
          url='https://vqfmbpqurapcsuixgvql.supabase.co/functions/v1/telegram-proxy?file_id='+fid
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Range':'bytes=0-1023'}),timeout=60) as response:
                  data=response.read()
                  print('PROXY',response.status,dict(response.headers),len(data),data[:16].hex())
                  assert data.startswith(b'%PDF-'), 'The response is not a PDF'
          except urllib.error.HTTPError as error:
              print('PROXY ERROR',error.code,error.read(4096).decode(errors='replace'))
              raise
          PY
