name: Telegram message verification
on:
  push:
    branches: [fix/catalog-sync-20260907]
    paths: [.github/workflows/catalog-sync-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve the existing channel message
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          url = 'https://vqfmbpqurapcsuixgvql.supabase.co/functions/v1/telegram-file-diagnostic?check=bancahq-2'
          try:
              with urllib.request.urlopen(url, timeout=45) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              result = json.loads(error.read().decode())
              print('HTTP status:', error.code)
          # Telegram file IDs are never printed to public workflow logs.
          result.pop('file_id', None)
          result.pop('file_unique_id', None)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not result.get('ok'):
              raise SystemExit(1)
          PY
