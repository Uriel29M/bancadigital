name: Fix empty personal collections
on:
  push:
    branches: [fix/empty-personal-collections]
    paths: [.github/workflows/fix-empty-personal-collections.yml]
permissions:
  contents: write
concurrency:
  group: empty-personal-collections-production
  cancel-in-progress: false
jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Keep personal collections visible for profile owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('js/app.js')
          source = app.read_text(encoding='utf-8')
          start = source.index('  function renderShelfLikePage(')
          end = source.index('\n  function renderPublicCollectionPage(', start)
          original = source[start:end]
          old_permission = 'const canEditPersonalCollections = own || isOwnShelfProfile();'
          new_permission = 'const canEditPersonalCollections = own || isOwnShelfProfile() || Boolean(state.session?.user?.id && String(profile?.id || "") === String(state.session.user.id));'
          old_section = 'if (own || categories.length) categoryMarkup ='
          new_section = 'if (canEditPersonalCollections || categories.length) categoryMarkup ='
          repaired = original
          if old_permission in repaired:
              repaired = repaired.replace(old_permission, new_permission, 1)
          elif new_permission not in repaired:
              raise SystemExit('Ownership condition not found')
          if old_section in repaired:
              repaired = repaired.replace(old_section, new_section, 1)
          elif new_section not in repaired:
              raise SystemExit('Collection section condition not found')
          assert new_permission in repaired
          assert new_section in repaired
          assert 'data-shelf-new-category' in repaired
          assert 'Crie uma coleção para começar a organizar seus salvos.' in repaired
          app.write_text(source[:start] + repaired + source[end:], encoding='utf-8')
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          def bump(pattern, text):
              def change(match):
                  parts = match.group(2).split('.')
                  parts[-1] = str(int(parts[-1]) + 1)
                  return match.group(1) + '.'.join(parts) + match.group(3)
              updated, count = re.subn(pattern, change, text, count=1)
              if count != 1:
                  raise SystemExit('Missing version anchor')
              return updated
          html = bump(r'(src="js/app\.js\?v=)([0-9]+(?:\.[0-9]+)*)(")', html)
          html = bump(r'(register\("\./sw\.js\?v=)([0-9]+)(")', html)
          index.write_text(html, encoding='utf-8')
          sw = Path('sw.js')
          sw.write_text(bump(r'(const CACHE_VERSION = "banca-digital-shell-v)([0-9]+)(";)', sw.read_text(encoding='utf-8')), encoding='utf-8')
          PY
      - name: Verify targeted behavior
        run: |
          node --check js/app.js
          node --check sw.js
          node <<'JS'
          const assert = require('node:assert/strict');
          const vm = require('node:vm');
          const fs = require('node:fs');
          const source = fs.readFileSync('js/app.js', 'utf8');
          const start = source.indexOf('  function renderShelfLikePage(');
          const end = source.indexOf('\n  function renderPublicCollectionPage(', start);
          assert.ok(start >= 0 && end > start);
          const fn = source.slice(start, end);
          assert.match(fn, /if \(canEditPersonalCollections \|\| categories\.length\) categoryMarkup =/);
          assert.match(fn, /state\.session\?\.user\?\.id/);
          const state = {session:{user:{id:'owner'}},favoriteIds:new Set(),readingProgress:new Map(),top10Lists:[],db:{library:[]}};
          const context = {
            state,
            isOwnShelfProfile:()=>false,
            shelfCollectionOrderForProfile:()=>[],
            normalizePersonalCollectionOrder:(_o,c)=>c.map(x=>String(x.id)),
            escapeHTML:v=>String(v??''),avatarMarkup:()=>'',factionDot:()=>'',trophyRoom:()=>'',
            shelfCollectionMarkup:n=>'<article>'+n+'</article>',top10Markup:()=>'',shelfItemsByIds:()=>[],publicCollectionItems:()=>[],
            personalCollectionControls:()=>'',publicProfileHref:()=>'#'
          };
          vm.createContext(context);
          vm.runInContext(fn+'\nthis.renderShelfLikePage=renderShelfLikePage;',context);
          const empty={items:[],visible:false};
          const render=(profileId)=>context.renderShelfLikePage({profile:{id:profileId,username:'teste'},own:false,savedItems:empty,savedSeries:empty,readItems:empty,completedItems:empty,likedItems:empty,categories:[],profileState:{favoriteIds:new Set(),readingProgress:new Map(),top10Lists:[],collectionLikes:new Set(),collectionLikeCounts:new Map()}});
          assert.match(render('owner'),/Coleções pessoais/);
          assert.match(render('owner'),/data-shelf-new-category/);
          assert.match(render('owner'),/Crie uma coleção para começar a organizar seus salvos\./);
          assert.doesNotMatch(render('other'),/data-shelf-new-category/);
          console.log('PASS');
          JS
      - name: Publish
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'js/app.js','index.html','sw.js'},changed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html sw.js
          git commit -m "fix: keep personal collections visible for owner"
          git push origin HEAD:main
