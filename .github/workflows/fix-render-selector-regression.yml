name: Fix render selector regression

on:
  push:
    branches:
      - "fix/render-selector-regression-20260920"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-render-selectors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Patch only the known collection selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("js/app.js")
          original = path.read_text(encoding="utf-8")
          text = original
          replacements = 0

          patterns = [
              (r'\$\\(([^()]*data-chat-room[^()]*)\)', r'$$\\(\1\)'),
              (r'\$\\(([^()]*data-private-chat-user[^()]*)\)', r'$$\\(\1\)'),
              (r'\$\\(([^()]*data-open[^()]*)\)\\.filter\\(', r'$$\\(\1\\).filter('),
              (r'\$\\(([^()]*data-home-section-move[^()]*)\)\\.forEach\\(', r'$$\\(\1\\).forEach('),
          ]

          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text)
              replacements += count

          if text != original:
              path.write_text(text, encoding="utf-8")
          print(f"Targeted replacements: {replacements}")

          checks = [
              r'\$\\(([^()]*data-home-section-move[^()]*)\)\\.forEach\\(',
              r'\$\\(([^()]*data-open[^()]*)\)\\.filter\\(',
          ]
          for pattern in checks:
              if re.search(pattern, text):
                  raise SystemExit(f"Known broken selector still present: {pattern}")
          PY

      - name: Verify JavaScript
        run: node --check js/app.js

      - name: Commit targeted source fix
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Fix collection selectors in render"
          git push origin HEAD:fix/render-selector-regression-20260920
