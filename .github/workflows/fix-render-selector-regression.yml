name: Fix render selector regression

on:
  push:
    branches:
      - "fix/render-selector-regression-20260920"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-render-selectors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch only the known collection selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("js/app.js")
          text = path.read_text(encoding="utf-8")
          original = text

          replacements = 0

          # These selectors are consumed as collections. Keep the rest of the
          # selector helper behavior unchanged.
          patterns = [
              (r'\$\\(([^()]*data-chat-room[^()]*)\)', r'$$\\(\1\)'),
              (r'\$\\(([^()]*data-private-chat-user[^()]*)\)', r'$$\\(\1\)'),
              (r'\$\\(([^()]*data-open[^()]*)\)\\.filter\\(', r'$$\\(\1\\).filter('),
              (r'\$\\(([^()]*data-home-section-move[^()]*)\)\\.forEach\\(', r'$$\\(\1\\).forEach('),
          ]

          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text)
              replacements += count

          if text == original:
              print("No known selector regression found; nothing to commit.")
          else:
              path.write_text(text, encoding="utf-8")
              print(f"Applied {replacements} targeted selector replacements.")

          # Hard validation: the specific broken collection calls must be gone.
          checks = [
              r'\$\\(([^()]*data-home-section-move[^()]*)\)\\.forEach\\(',
              r'\$\\(([^()]*data-open[^()]*)\)\\.filter\\(',
          ]
          for pattern in checks:
              if re.search(pattern, text):
                  raise SystemExit(f"Known broken selector still present: {pattern}")
          PY

      - name: Verify patch and syntax
        run: |
          node --check js/app.js
          grep -nE 'data-home-section-move|data-open|data-chat-room|data-private-chat-user' js/app.js | head -80

      - name: Commit targeted fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Fix collection selectors in render"
          git push origin HEAD:fix/render-selector-regression-20260920
