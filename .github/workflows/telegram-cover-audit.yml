name: Telegram cover production smoke test
on:
  push:
    branches: [fix/telegram-image-covers]
    paths: [.github/workflows/telegram-cover-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published source and gateway
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          site='https://uriel29m.github.io/bancadigital/'
          base='https://vqfmbpqurapcsuixgvql.supabase.co/functions/v1/telegram-cover'
          source='https://raw.githubusercontent.com/Uriel29M/bancadigital/main/index.html'
          with urllib.request.urlopen(source, timeout=30) as response:
              html=response.read().decode()
              assert 'js/telegram-covers.js?v=1' in html
              assert 'js/app.js?v=2.2.10.449' in html
          print('Published main contains cover integration.')
          with urllib.request.urlopen(site+'?cover-check=242', timeout=30) as response:
              html=response.read().decode()
              print('Pages contains new script:', 'js/telegram-covers.js?v=1' in html)
          def check(request, expected):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status=response.status; data=json.load(response); headers=response.headers
              except urllib.error.HTTPError as error:
                  status=error.code; headers=error.headers; data=json.loads(error.read())
              assert status==expected, (status,data)
              assert headers.get('Access-Control-Allow-Origin')=='*'
              assert data.get('error')
              return data
          check(urllib.request.Request(base+'?url=https%3A%2F%2Ft.me%2Fbancahq%2F999999999',headers={'Origin':site}),404)
          print('Unregistered image: 404 with CORS verified')
          check(urllib.request.Request(base,method='POST',data=b'{"url":"https://t.me/bancahq/2"}',headers={'Content-Type':'application/json','Origin':site}),401)
          print('Unauthenticated registration: 401 verified')
          check(urllib.request.Request(base+'?url=https%3A%2F%2Fevil.example%2Ffile',headers={'Origin':site}),400)
          print('Invalid external source rejected')
          PY
