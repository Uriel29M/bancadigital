name: Verify large Telegram archive
on:
  push:
    branches: [fix/telegram-large-files-20260908]
    paths: ['.github/workflows/test-telegram-verified.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare actual Telegram connectivity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const root='https://vqfmbpqurapcsuixgvql.supabase.co/functions/v1/';
          for(const [name,path] of [['existing-smoke','telegram-mtproto-smoke?check=banca-mtproto-34mb'],['verified','telegram-mtproto-verified?item_id=series-all-star-western-2011-novos-52-029']]){
            const response=await fetch(root+path,{headers:name==='verified'?{Range:'bytes=0-4095'}:{},signal:AbortSignal.timeout(90000)});
            const type=response.headers.get('content-type')||'';
            const body=type.includes('json')?await response.json():new Uint8Array(await response.arrayBuffer());
            console.log(name, response.status, type.includes('json')?JSON.stringify(body):`bytes=${body.length} signature=${Buffer.from(body.subarray(0,8)).toString('hex')}`);
            if(name==='verified')assert.equal(response.status,206);
          }
          JS
