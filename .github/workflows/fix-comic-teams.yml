name: Aplicar correção da ordem de Equipes

on:
  push:
    paths:
      - .github/workflows/fix-comic-teams.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            index.html
            js/app.js
          sparse-checkout-cone-mode: false
      - name: Corrigir o organizador de Quadrinhos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'js/app.js': '0a16062b20c4e0973272dcbdafada9a0d5d66fc3',
              'index.html': '16cdc5b77edde138fab0a520694e08da82ba7f59',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise RuntimeError(f'{path} mudou desde a análise; correção interrompida para preservar o trabalho existente.')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: esperado um trecho, encontrados {count}.')
              return text.replace(old, new, 1)

          path = Path('js/app.js')
          source = path.read_text(encoding='utf-8')
          source = replace_once(source,
              'return [...unique, ...missing.filter(key => key !== "teams")];',
              'return [...unique, ...missing.filter(key => !unique.includes(key))];',
              'Normalização da ordem')

          start = source.index('  function bindComicSectionControls() {')
          end = source.find('\n  }', start)
          if end < 0:
              raise RuntimeError('Não foi possível delimitar o organizador de Quadrinhos.')
          end += len('\n  }')
          binder = source[start:end]
          if 'state.section !== "comic"' not in binder or 'comicVisibleSectionKeys' not in binder:
              raise RuntimeError('O organizador de Quadrinhos não corresponde à versão analisada.')

          binder = replace_once(binder,
              '    if (!content) return;\n',
              '    if (!content) return;\n'
              '    const teamSection = document.querySelector("#main .wiki-team-carousel-section");\n'
              '    if (teamSection && teamSection.parentElement !== content) content.appendChild(teamSection);\n',
              'Inclusão de Equipes no contêiner')
          binder = replace_once(binder,
              '    const sectionKeyFor = element => {\n',
              '    const sectionKeyFor = element => {\n'
              '      if (element.classList.contains("wiki-team-carousel-section")) return "teams";\n',
              'Identificação da seção Equipes')

          anchor = '    if (!canManageHomepageOrder()) return;\n    keyedSections.forEach(({ element, key }) => {'
          reordered = (
              '    state.comicVisibleSectionKeys.forEach(key => {\n'
              '      const entry = keyedSections.find(item => item.key === key);\n'
              '      if (entry) content.appendChild(entry.element);\n'
              '    });\n'
              '    if (!canManageHomepageOrder()) return;\n'
              '    keyedSections.forEach(({ element, key }) => {'
          )
          binder = replace_once(binder, anchor, reordered, 'Aplicação da ordem para todos os usuários')
          source = source[:start] + binder + source[end:]

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          html = replace_once(html,
              '  <style>\n    /* O carrossel de equipes não pertence à página Quadrinhos. */\n    body:has(.main-nav [data-section="comics"].active) #main .wiki-team-carousel-section {\n      display: none !important;\n    }\n  </style>\n',
              '', 'Remoção da ocultação incorreta')
          html = replace_once(html, 'js/app.js?v=2.2.10.445', 'js/app.js?v=2.2.10.446', 'Atualização da versão do aplicativo')
          path.write_text(source, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          print('Correção aplicada: Equipes integrada à ordem e ocultação anterior removida.')
          PY
      - name: Verificar sintaxe e regras de ordenação
        run: |
          node --check js/app.js
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert/strict');
          const src = fs.readFileSync('js/app.js', 'utf8');
          const order = JSON.parse(src.match(/const COMIC_SECTION_ORDER = (\[[^;]+\]);/)[1]);
          const fn = src.match(/  function normalizeComicSectionOrder\(value\) \{[\s\S]*?\n  \}/)[0];
          const normalize = vm.runInNewContext(`(() => { const COMIC_SECTION_ORDER = ${JSON.stringify(order)}; ${fn}; return normalizeComicSectionOrder; })()`);
          const check = (actual, expected) => assert.deepEqual(Array.from(actual), expected);
          check(normalize(null), order);
          check(normalize(['characters', 'teams', 'series']), ['characters', 'teams', 'series', ...order.filter(k => !['characters', 'teams', 'series'].includes(k))]);
          check(normalize([...order].reverse()), [...order].reverse());
          const missing = Array.from(normalize(['series', 'characters']));
          assert.equal(missing[missing.indexOf('characters') + 1], 'teams');
          assert.equal(new Set(Array.from(normalize(['teams', 'teams']))).size, order.length);
          const binder = src.slice(src.indexOf('  function bindComicSectionControls() {'), src.indexOf('  function bindComicSectionControls() {') + 16000);
          assert.match(binder, /teamSection\.parentElement !== content\) content\.appendChild\(teamSection\)/);
          assert.match(binder, /wiki-team-carousel-section"\)\) return "teams"/);
          assert.match(binder, /state\.comicVisibleSectionKeys\.forEach\(key => \{[\s\S]*?content\.appendChild\(entry\.element\);[\s\S]*?if \(!canManageHomepageOrder\(\)\) return;/);
          const html = fs.readFileSync('index.html', 'utf8');
          assert.doesNotMatch(html, /O carrossel de equipes não pertence/);
          assert.match(html, /js\/app\.js\?v=2\.2\.10\.446/);
          console.log('PASSOU: sintaxe, ordem padrão, ordem salva, Equipes, controles e visibilidade.');
          JS
      - name: Publicar a correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- js/app.js index.html
          git commit -m "fix: integrar Equipes à ordem das seções de Quadrinhos"
          git push origin HEAD:main
