name: Test Telegram MTProto
on:
  push:
    branches: [fix/telegram-mtproto-direct]
    paths:
      - 'supabase/functions/telegram-mtproto/**'
      - 'scripts/test-telegram-mtproto.mjs'
      - '.github/workflows/test-telegram-mtproto.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          node --check supabase/functions/telegram-mtproto/media-core.mjs
          node --test scripts/test-telegram-mtproto.mjs
      - name: Verify actual Telegram download without exposing secrets
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://vqfmbpqurapcsuixgvql.supabase.co/functions/v1/telegram-mtproto';
          const health = await fetch(`${base}?health=1`, {signal:AbortSignal.timeout(20000)});
          const data = await health.json();
          assert.equal(health.status,200);
          assert.equal(data.mode,'mtproto');
          assert.equal(data.configured,true,'MTProto credentials are not configured in Supabase');
          const url = `${base}?item_id=series-all-star-western-2011-novos-52-029`;
          const size = 34688050;
          for (const [start,end] of [[0,4095],[size-4096,size-1]]) {
            const response = await fetch(url,{headers:{Range:`bytes=${start}-${end}`},signal:AbortSignal.timeout(90000)});
            if (!response.ok) {
              let error = 'Non-JSON response';
              try {const body=await response.json();error=body.code || body.error || error;} catch {}
              throw new Error(`Live download failed: HTTP ${response.status}: ${String(error).slice(0,300)}`);
            }
            const bytes = new Uint8Array(await response.arrayBuffer());
            assert.equal(response.status,206);
            assert.equal(bytes.length,end-start+1);
            assert.equal(response.headers.get('content-range'),`bytes ${start}-${end}/${size}`);
            if(start===0) assert.match(Buffer.from(bytes.subarray(0,8)).toString('hex'),/^526172211a07(?:00|0100)/);
            console.log(`LIVE TEST PASS: bytes ${start}-${end} of ${size}`);
          }
          JS
