name: Inspect 4shared public source
on:
  push:
    branches: [feature/4shared-reader]
    paths:
      - scripts/inspect-fourshared.mjs
      - .github/workflows/apply-fourshared-reader.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public HTML and download metadata
        run: node scripts/inspect-fourshared.mjs
      - name: Preserve diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourshared-diagnostic
          path: fourshared-diagnostic/
          retention-days: 1
