name: Apply 4shared reader integration
on:
  push:
    branches: [feature/4shared-reader]
    paths:
      - scripts/apply-fourshared-reader.mjs
      - .github/workflows/apply-fourshared-reader.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/4shared-reader
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: node scripts/apply-fourshared-reader.mjs
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/reader-4shared-v2.js
      - name: Commit only reader integration
        run: |
          if ! git diff --quiet -- js/app.js index.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add js/app.js index.html
            git commit -m 'Integrate 4shared adapter into reader'
            git push origin HEAD:feature/4shared-reader
          fi
