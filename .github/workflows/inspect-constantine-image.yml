name: Inspecionar imagens do Constantine
on:
  push:
    paths:
      - .github/workflows/inspect-constantine-image.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            js/app.js
          sparse-checkout-cone-mode: false
      - name: Consultar as fontes reais das imagens
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          from pathlib import Path
          report = {}
          queries = [
            ('profile', 'pt', {'generator':'search','gsrsearch':'John Constantine DC Comics','gsrnamespace':'0','gsrlimit':'20','prop':'extracts|pageimages','exintro':'1','explaintext':'1','piprop':'thumbnail','pithumbsize':'240'}),
            ('carousel', 'pt', {'generator':'search','gsrsearch':'John Constantine','gsrnamespace':'0','gsrlimit':'5','prop':'pageimages','piprop':'thumbnail','pithumbsize':'180'}),
            ('canonical', 'en', {'titles':'John Constantine','prop':'pageimages','piprop':'thumbnail|original','pithumbsize':'480'}),
            ('portuguese', 'pt', {'titles':'John Constantine (Hellblazer)','prop':'pageimages','piprop':'thumbnail|original','pithumbsize':'480'})
          ]
          for label,lang,params in queries:
              params.update(action='query',format='json')
              url=f'https://{lang}.wikipedia.org/w/api.php?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'BancaDigitalImageDiagnosis/1.0 (public wiki image metadata)'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response: data=json.load(response)
                  report[label]=[{'title':p.get('title'),'thumbnail':p.get('thumbnail',{}).get('source'),'original':p.get('original',{}).get('source')} for p in data.get('query',{}).get('pages',{}).values()]
              except Exception as exc: report[label]={'error':str(exc)}
          Path('constantine-portrait-sources.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Salvar diagnóstico na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/constantine-image
          git checkout -B fix/constantine-image origin/fix/constantine-image
          git add --sparse constantine-portrait-sources.json
          git commit -m "chore: inspect Constantine portrait sources"
          git push origin HEAD:fix/constantine-image
