name: Inspecionar imagens do Constantine
on:
  push:
    paths:
      - .github/workflows/inspect-constantine-image.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            js/app.js
          sparse-checkout-cone-mode: false
      - name: Extrair resolutores de imagens e perfis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          src = Path('js/app.js').read_text(encoding='utf-8')
          lines = src.splitlines()
          ranges = [(5285,5400),(13080,13310)]
          report = {'app_sha': subprocess.check_output(['git','hash-object','js/app.js'],text=True).strip(), 'sections': {}}
          for a,b in ranges:
              report['sections'][f'{a}-{b}'] = '\n'.join(f'{i+1}: {lines[i]}' for i in range(a-1,min(b,len(lines))))
          for i,line in enumerate(lines):
              if re.search(r'^  (?:async )?function (?:loadCharacterSettings|loadWikiQuickInfo|characterSettingForName|defaultWikiReferenceForEntity|fandomImageFromHtml|characterImage|renderWikiCharacterCarousel|wikiCharacterCarousel|hydrateWikiCharacter)',line):
                  report['sections'][str(i+1)] = '\n'.join(f'{j+1}: {lines[j]}' for j in range(i,min(i+100,len(lines))))
          Path('constantine-image-paths.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Salvar diagnóstico na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/constantine-image
          git checkout -B fix/constantine-image origin/fix/constantine-image
          git add --sparse constantine-image-paths.json
          git commit -m "chore: inspect character image resolution"
          git push origin HEAD:fix/constantine-image
